name: BRUCE FIRE CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pgsql, pdo_sqlite, gd, zip
          coverage: none

      - name: Validate Composer manifest
        working-directory: api
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run backend checks
        working-directory: api
        run: |
          if [ -f artisan ]; then
            php vendor/phpunit/phpunit/phpunit
          else
            find app routes -name '*.php' -print0 | xargs -0 -n1 php -l
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f web/package-lock.json ]; then
            cd web
            npm ci
          elif [ -f web/package.json ]; then
            cd web
            npm install
          else
            echo "No web/package.json found; skipping dependency install."
          fi

      - name: Build frontend
        run: |
          if [ -f web/package.json ]; then
            cd web
            npm run build
          else
            echo "No frontend project found; skipping build."
          fi
